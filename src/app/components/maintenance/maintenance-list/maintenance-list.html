<app-maintenance-form [vin]="vin()" [successfulSubmit]="getMaintenances.bind(this)"></app-maintenance-form>
<h1>Maintenance List</h1>
<div class="maintenance-list">
  @if (error()) {
    {{ error() }}
  } @else {
    @for (maintenance of maintenances(); track maintenance.id) {
      <app-maintenance-item [maintenance]="maintenance"></app-maintenance-item>
    } @empty {
      No Maintenance Records Found
    }
  }
</div>
